# 빌드 입력 경로를 늘리면 .github/workflows/docs.yml 의 paths 목록과 감지 스텝도 함께 고친다.
site_name: Kintoun Infra 기술 문서
site_description: 근두운 AWS 인프라의 설계, Terraform 운영 절차와 CI
site_url: https://tfdoc.kintoun.work/
repo_url: https://github.com/kintoun-secops/kintoun-infra
repo_name: kintoun-secops/kintoun-infra
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: ko
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - 프로젝트 개요: index.md
  - 아키텍처: architecture.md
  - 저장소 구조: structure.md
  - 루트 모듈:
      - Bootstrap: modules/bootstrap.md
      - Platform: modules/platform.md
      - Network: modules/platform/network.md
      - Wazuh: modules/platform/wazuh.md
      - Identity: modules/identity.md
      - Victim: modules/victim.md
      - GuardDuty: modules/wazuh-logging/guardduty.md
      - WAF Log: modules/wazuh-logging/waf-log.md
      - Attacker: modules/platform/attacker.md
      - Service:
          - 개요: modules/service.md
          - Network: modules/platform/service-network.md
          - DB: modules/platform/service-db.md
          - DB Init: modules/service-db-init.md
          - App: modules/platform/service-app.md
      - Velociraptor: modules/platform/velociraptor.md
  - 운영 절차:
      - 팀원 추가: runbooks/add-user.md
      - 권한 및 그룹 변경: runbooks/change-access.md
      - Wazuh 접속 및 복구: runbooks/wazuh.md
      - 중지한 EC2와 plan 변경: runbooks/ec2-stopped.md
      - State와 장애 대응: runbooks/terraform.md
      - Platform state 이전: runbooks/platform-migration.md
      - Kali 접속 방법: runbooks/kali.md
      - Velociraptor 접속 방법: runbooks/velociraptor.md
  - 개발 규칙: conventions.md
  - CI:
      - 개요: ci/index.md
      - PR plan과 코멘트: ci/plan.md
      - Main apply: ci/apply.md
      - KMS 검사: ci/kms.md
      - Rego 정책: ci/rego.md
      - 포맷 검사: ci/format.md
      - 스크립트: ci/scripts.md
      - RDS 상태 유지: ci/rds-state.md
      - 문서 CI와 Pages: ci/docs.md
  - 문서 작성과 미리 보기: documentation.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
