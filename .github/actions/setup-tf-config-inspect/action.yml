name: Terraform 구성 분석 도구 설치
description: 고정한 terraform-config-inspect 버전을 설치한다.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.26.x'
        cache: false
    - shell: bash
      env:
        GOBIN: ${{ runner.temp }}/tf-config-inspect
      run: |
        go install github.com/hashicorp/terraform-config-inspect@75d64de68c31445dbe4ee8308350e0b6dda1571d
        echo "$GOBIN" >> "$GITHUB_PATH"
