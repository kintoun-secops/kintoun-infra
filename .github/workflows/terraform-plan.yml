# PR 에서 plan 만 수행 (읽기 전용 롤).
# 사전 조건: bootstrap 출력 plan_role_arn 을 저장소 Variables 의 AWS_PLAN_ROLE_ARN 에 등록.
# 루트 모듈은 backend.tf 와 terraform-roots.json 으로 자동 발견한다 — 이 파일에 디렉터리를 적지 않는다.
# PR 트리거에는 paths 필터를 걸지 않는다 (필터로 건너뛴 required check 는 머지를 막는다).
# 대신 discover 잡이 PR 의 변경 파일로 plan 할 루트를 고르고, 변경 영향이 없는 루트는 plan 을 생략한다.

name: terraform plan

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

# 같은 PR 의 이전 커밋 plan 은 취소한다. apply 와는 다른 그룹이다.
concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CONFTEST_VERSION: "0.69.0"

jobs:
  # 자격증명 없이 도는 검사. 모든 루트가 대상이다.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: 개발 도구 설치
        run: npm ci --ignore-scripts
      - name: 포맷 검사 (Terraform·JavaScript·JSON)
        run: npm run format:check
      - uses: ./.github/actions/setup-tf-config-inspect
      - name: 루트 모듈 목록 검증
        run: |
          node .github/scripts/test-tf-roots.js
          node .github/scripts/test-tf-targets.js
          node .github/scripts/tf-roots.js
      - name: validate (backend·자격증명 없이)
        run: |
          for d in bootstrap $(node .github/scripts/tf-roots.js --list); do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate -no-color
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # 플러그인 내려받기 rate limit 회피
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" -f compact
      - name: conftest 설치
        run: |
          curl -sSfL -o /tmp/conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin conftest
      - name: 정책 테스트
        run: conftest verify --policy .github/policy
      - name: Access Analyzer 입력 테스트
        run: node .github/scripts/test-validate-iam-policies.js
      - name: Plan 요약 조합 테스트
        run: |
          node .github/scripts/test-plan-summary.js
          node .github/scripts/test-kms-summary.js
  # backend.tf 스캔 == 매니페스트 여야 통과한다. 여기서 실패하면 plan 은 돌지 않는다.
  # 이어서 PR 의 변경 파일로 plan 대상을 고른다. 파일 목록 조회가 실패하면 잡이 실패한다 (조용히 생략되는 루트는 없다).
  discover:
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
      targets: ${{ steps.targets.outputs.targets }}
      skipped: ${{ steps.targets.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tf-config-inspect
      - id: roots
        run: node .github/scripts/tf-roots.js --github-output
      - name: 변경 파일과 기준 매니페스트 조회
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/terraform-roots.json" \
            -f ref="$PR_BASE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/base-roots.json"
      # 파일 목록 API 는 최대 3000개까지만 내려온다. 넘치면 전체 루트를 plan 한다.
      - name: plan 대상 선별
        id: targets
        env:
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "${PR_CHANGED_FILES}" -gt 3000 ]; then
            node .github/scripts/tf-targets.js --all --github-output
          else
            node .github/scripts/tf-targets.js --changed "$RUNNER_TEMP/changed-files.txt" \
              --base-manifest "$RUNNER_TEMP/base-roots.json" --github-output
          fi

  # apply 순서(wave)를 Mermaid 그래프와 표로 그려 코멘트 하나로 남긴다. 자격증명이 없고 discover 와 같은
  # 계산이라 plan 을 기다리지 않는다. 매니페스트가 깨지면 새 코멘트는 만들지 않고 기존 코멘트만 미계산으로 바꾼다.
  wave-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: render
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/wave-comment.js --out wave-comment.md
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apply-order
          path: wave-comment.md
          skip_unchanged: true
          only_update: ${{ steps.render.outputs.only_update }}

  # 대상이 없으면 잡을 건너뛴다 (빈 matrix 는 워크플로 오류다). 건너뛴 사유는 result 가 대상 목록으로 확인한다.
  plan:
    needs: [lint, discover]
    if: needs.discover.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.targets) }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      dir: ${{ matrix.dir }}

  # IAM·KMS 판정과 변경 없는 platform plan을 용도별 코멘트로 모은다.
  plan-summary:
    runs-on: ubuntu-latest
    needs: [discover, plan]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: iam-findings-*
          path: findings
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: render
        env:
          # discover 가 실패하면 둘 다 비어 있어 미검사로 표시한다. 생략한 루트는 실패로 세지 않는다.
          TF_TARGETS: ${{ needs.discover.outputs.targets }}
          TF_SKIPPED: ${{ needs.discover.outputs.skipped }}
        with:
          script: |
            const render = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/plan-summary.js`);
            await render({
              github, context, core,
              findingsDir: `${process.env.GITHUB_WORKSPACE}/findings`,
              outFile: `${process.env.GITHUB_WORKSPACE}/iam-guard.md`,
              expectedDirs: JSON.parse(process.env.TF_TARGETS || '[]'),
              skippedDirs: JSON.parse(process.env.TF_SKIPPED || '[]'),
            });
      - name: 변경 없는 platform plan 요약
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: platform-no-changes
          message: ${{ steps.render.outputs.unchanged_body }}
          delete: ${{ steps.render.outputs.unchanged_delete }}
          skip_unchanged: true
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: iam-guard
          path: iam-guard.md
          skip_unchanged: true
          only_update: ${{ steps.render.outputs.only_update }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: kms
        env:
          TF_TARGETS: ${{ needs.discover.outputs.targets }}
          TF_SKIPPED: ${{ needs.discover.outputs.skipped }}
        with:
          script: |
            const render = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/kms-summary.js`);
            await render({
              github, context, core,
              findingsDir: `${process.env.GITHUB_WORKSPACE}/findings`,
              outFile: `${process.env.GITHUB_WORKSPACE}/kms-guard.md`,
              expectedDirs: JSON.parse(process.env.TF_TARGETS || '[]'),
              skippedDirs: JSON.parse(process.env.TF_SKIPPED || '[]'),
            });
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: kms-guard
          path: kms-guard.md
          skip_unchanged: true
          only_update: ${{ steps.kms.outputs.only_update }}

  # 브랜치 보호의 required check 는 이 잡 하나만 가리킨다 (plan (…) 이름은 루트가 늘면 바뀐다).
  # plan 대상이 없어 건너뛴 경우만 성공이다. 다른 이유로 건너뛰거나 실패하면 통과하지 않는다.
  result:
    runs-on: ubuntu-latest
    needs: [lint, discover, wave-comment, plan, plan-summary]
    if: always()
    env:
      TF_TARGETS: ${{ needs.discover.outputs.targets }}
    steps:
      - run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.discover.result }}" = success
          case "${{ needs.plan.result }}" in
            success) ;;
            skipped) test "$TF_TARGETS" = '[]' ;;
            *) exit 1 ;;
          esac
