# PR 에서 plan 만 수행 (읽기 전용 롤).
# 사전 조건: bootstrap apply 후 출력된 plan_role_arn 을
#   저장소 Settings > Secrets and variables > Actions > Variables 에
#   AWS_PLAN_ROLE_ARN 으로 등록.
# 루트 모듈이 늘면 plan 잡의 matrix.dir 목록에 추가한다
# (state 키는 bootstrap/oidc.tf 의 local.tfstate_keys 에도 함께 추가).
# 2410 Checkov 게이트는 W6 에 이 워크플로우에 스텝으로 추가한다.

name: terraform plan

on:
  pull_request:
    paths:
      - "platform/**"
      - "identity/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # OIDC 토큰 발급에 필수
  contents: read
  pull-requests: write # plan 결과를 PR 코멘트로 남기기 위해 필요

jobs:
  # 저장소 전체를 한 번만 검사한다 (루트 모듈마다 반복할 이유가 없다).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt check
        run: terraform fmt -check -recursive

  plan:
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false # 한 모듈이 깨져도 나머지 plan 은 보여준다
      matrix:
        dir: [platform, identity]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: hashicorp/setup-terraform@v3

      - name: init
        run: terraform init

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        run: terraform plan -no-color -lock-timeout=60s
        continue-on-error: true

      - name: comment plan on PR
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
          TF_DIR: ${{ matrix.dir }}
        with:
          script: |
            const dir = process.env.TF_DIR;
            const marker = `<!-- terraform-plan-${dir} -->`;
            const ok = '${{ steps.plan.outcome }}' === 'success';

            // 코멘트 최대 길이(65536자) 초과 대비
            let output = ok ? process.env.PLAN_STDOUT : process.env.PLAN_STDERR;
            const LIMIT = 60000;
            if (output.length > LIMIT) {
              output = output.slice(0, LIMIT)
                + '\n... (출력이 잘렸습니다. 전체는 Actions 로그 참고)';
            }

            const body = [
              marker,
              `## ${dir} terraform plan ${ok ? '✅' : '❌ 실패'}`,
              '',
              '<details><summary>plan 출력 펼치기</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
              '',
              `*commit ${context.sha.slice(0, 7)} ·`
                + ` [실행 로그](${context.serverUrl}/${context.repo.owner}/`
                + `${context.repo.repo}/actions/runs/${context.runId})*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
