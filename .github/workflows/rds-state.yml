name: rds state

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rds-state
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      ROOT: platform/service-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-rds-state-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: 초기화
        run: terraform -chdir="$ROOT" init -input=false
      - name: 현재 상태 읽기
        run: |
          set -euo pipefail
          identifier=$(terraform -chdir="$ROOT" output -raw db_identifier)
          status=$(aws rds describe-db-instances \
            --db-instance-identifier "$identifier" \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "$identifier 의 현재 상태는 $status 입니다." >> "$GITHUB_STEP_SUMMARY"

      - name: 선언한 상태로 되돌리기
        run: |
          terraform -chdir="$ROOT" apply -input=false -no-color -lock-timeout=120s \
            -target=aws_rds_instance_state.main -auto-approve
