# 저장소가 public 이므로 GitHub Free 조직에서도 Pages 를 쓸 수 있다.
# main 의 문서 변경과 main 에서 실행한 수동 실행만 배포하고, PR 은 빌드 검증까지만 한다.
# 배포 대상과 사이트 주소는 docs/ci/docs.md 참고.
# PR 트리거에는 paths 필터를 걸지 않는다 — 필터로 건너뛴 required check 는 머지를 막는다.
# 대신 감지 스텝이 변경 파일을 대조해 문서와 무관한 PR 이면 나머지 스텝을 건너뛴다.
# if 로 건너뛴 스텝은 success 로 보고되어 required check 를 통과시킨다.

name: docs

on:
  pull_request:
  push:
    branches: [main]
    # push 는 required check 가 아니므로 트리거에서 거른다. 감지 스텝의 목록과 함께 고친다.
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # 감지 스텝의 변경 파일 조회

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      # 문서 결과물에 영향을 주는 변경이 있는지 본다. push 트리거의 paths 목록과 함께 고친다.
      # 파일 목록 조회가 실패하면 잡이 실패한다 — 조용히 건너뛰어 성공이 되는 일은 없다.
      - name: 문서 관련 변경 감지
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          run=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|*.md|mkdocs.yml|requirements-docs.txt|.github/workflows/docs.yml) run=true ;;
            esac
          done <<< "$files"
          # 파일 목록 API 는 최대 3000개까지만 내려온다. 넘치면 건너뛰지 않고 빌드한다.
          if [ "${PR_CHANGED_FILES}" -gt 3000 ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.run == 'true'
        id: python
        with:
          python-version: "3.12"
      # 의존성이 정확히 고정되어 있으므로 가상환경 전체를 캐시해 설치를 건너뛴다.
      # Python 패치 버전이 키에 들어가 러너 이미지가 바뀌면 새로 만든다.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.changes.outputs.run == 'true'
        id: venv
        with:
          path: .venv
          key: docs-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-docs.txt') }}
      - name: 문서 의존성 설치
        if: steps.changes.outputs.run == 'true' && steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-docs.txt
      - name: 문서 빌드 및 내부 링크 검증
        if: steps.changes.outputs.run == 'true'
        env:
          NO_MKDOCS_2_WARNING: "1" # 2.x 릴리스는 dependabot 의 major PR 로 확인한다
        run: .venv/bin/python -m mkdocs build --strict
      - name: HTML 아티팩트 업로드
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          if-no-files-found: error
          retention-days: 7
      # deploy 잡이 가져갈 tar 를 따로 만든다. PR 의 ref 는 refs/pull/*/merge 라 여기서 걸러진다.
      - name: Pages 아티팩트 업로드
        if: steps.changes.outputs.run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  # 빌드를 건너뛴 실행은 올린 아티팩트가 없으므로 배포도 하지 않는다.
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # 배포 생성
      id-token: write # Pages 가 아티팩트 출처를 검증하는 OIDC 토큰
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
