# 보호된 main 에 머지된 코드만 apply (apply 롤의 sub 조건과 한 쌍).
# 사전 조건: bootstrap 출력 apply_role_arn 을 저장소 Variables 의 AWS_APPLY_ROLE_ARN 에 등록.
# 루트 모듈이 늘면 잡을 추가하고 needs 로 선후를 건다. matrix 는 순서를 보장하지 않는다.

name: terraform apply

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "identity/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read

# 실행(run) 사이에도 apply 가 겹치지 않게 워크플로 전체를 한 그룹으로 묶는다.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: terraform init
      - run: terraform apply -auto-approve -lock-timeout=60s

  identity:
    needs: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: terraform init
      - run: terraform apply -auto-approve -lock-timeout=60s
