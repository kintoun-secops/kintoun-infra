# 보호된 main 에 머지된 코드만 apply (apply 롤의 sub 조건과 한 쌍).
# 사전 조건: bootstrap 출력 apply_role_arn 을 저장소 Variables 의 AWS_APPLY_ROLE_ARN 에 등록.
# 루트 모듈은 자동 발견하고, 선후는 terraform-roots.json 의 depends_on 으로 wave 를 나눈다.
# 매니페스트의 의존 깊이를 실행 시 계산해 모든 wave를 순서대로 처리한다.
# workflow_dispatch 도 main 에서만 돌리면 sub 가 ref:refs/heads/main 이라 trust 변경 없이 재실행에 쓸 수 있다.

name: terraform apply

on:
  push:
    branches: [main]
    # 테라폼 결과에 영향이 없는 경로만 제외한다. 다른 파일이 하나라도 섞이면 그대로 돈다.
    # apply 는 required check 가 아니므로 plan 과 달리 필터를 걸어도 머지를 막지 않는다.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 연속 실행은 최대 100개까지 대기 시작 시각 순으로 처리한다 (커밋 순서 보장은 아님).
# 기본 queue 는 대기 run 을 하나만 남기고 취소한다.
concurrency:
  group: terraform-apply
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      waves: ${{ steps.roots.outputs.waves }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: roots
        run: |
          result=$(node .github/scripts/tf-roots.js)
          echo "waves=$(jq -c '.waves' <<< "$result")" >> "$GITHUB_OUTPUT"

  apply:
    needs: discover
    if: needs.discover.result == 'success'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      WAVES: ${{ needs.discover.outputs.waves }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ap-northeast-2
      - name: wave별 apply
        run: |
          set -euo pipefail
          wave=0
          while [ "$wave" -lt "$(jq length <<< "$WAVES")" ]; do
            jq -r ".[$wave][]" <<< "$WAVES" | while IFS= read -r dir; do
              echo "Applying $dir in wave $wave"
              terraform -chdir="$dir" init -input=false
              set +e
              terraform -chdir="$dir" plan -input=false -no-color -lock-timeout=60s -detailed-exitcode -out=tfplan
              rc=$?
              set -e
              case "$rc" in
                0) echo "$dir: 변경 없음"; rm -f "$dir/tfplan" ;;
                2) terraform -chdir="$dir" apply -input=false -no-color -lock-timeout=60s tfplan; rm -f "$dir/tfplan" ;;
                *) exit "$rc" ;;
              esac
            done
            wave=$((wave + 1))
          done
      - name: 산출물 정리
        if: always()
        run: |
          jq -r '.[][]' <<< "$WAVES" | while IFS= read -r dir; do
            rm -f "$dir/tfplan"
          done
