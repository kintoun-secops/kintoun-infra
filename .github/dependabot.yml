# 액션은 커밋 SHA 로 고정한다. 새 릴리스가 나오면 dependabot 이 SHA 와 버전 주석을 함께 올린다.
# 업데이트는 ecosystem 별로 묶어서 PR 하나로 받고, major 는 검토가 필요하므로 개별 PR 로 남긴다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(.github)"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docs"
    groups:
      docs-python:
        update-types:
          - minor
          - patch
