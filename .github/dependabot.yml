# 액션은 커밋 SHA 로 고정한다. 새 릴리스가 나오면 dependabot 이 SHA 와 버전 주석을 함께 올린다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(.github)"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docs"
